name: test
on: [push, pull_request]
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The private deny pattern scrub-check.sh and stranger.test.sh read (kept out of the repo). A fork's PR gets no
    # secrets: there alone scrub-check skips; anywhere else a missing secret fails it.
    env:
      SCRUB_DENY: ${{ secrets.SCRUB_DENY }}
      SCRUB_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scrub-check.sh
      - name: shell suites
        if: ${{ !cancelled() }}   # independent of the scrub: a failed scrub still shows these
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          fail=0
          while IFS= read -r t; do
            echo "== $t"
            bash "$t" || fail=1
          done < <(git ls-files '*.test.sh')
          exit $fail
  # The hooks modules' tests and the manifests, as `claude plugin test` and `validate` run them locally (no account
  # needed). Not tsc: its types are written by Claude Code when a session loads the plugin, so they aren't in a
  # checkout (README, Contributing).
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - run: claude plugin validate .
      - name: validate and test each plugin
        run: |
          fail=0
          for p in plugins/*/; do
            echo "== $p"
            claude plugin validate "$p" || fail=1
            # claude plugin test needs a hooks module; a plugin with shell hooks only has nothing for it to load.
            if jq -e '.modules // empty' "$p/hooks/hooks.json" >/dev/null 2>&1; then claude plugin test "$p" || fail=1; else echo "no hooks module: plugin test skipped"; fi
          done
          exit $fail
